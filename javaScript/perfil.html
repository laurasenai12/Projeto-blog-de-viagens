<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="header">
        <h1>Bem-vindo ao Perfil</h1>
    </header>
    <main>
        <form class="form">
        <div class="alert alert-info" role="alert" style="display: none;" id="mensagem">
            
        </div>
            <div>
                <img src="meme.jpg" alt="Foto de Perfil" width="150"
                onmouseover="console.log('Mouse sobre a imagem!')">
            </div>

            <div class="form-group">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" required value="Seu Nome">
            </div>
            
            <div class="form-group">
            <label for="nascimento" class="form-label">Data de Nascimento:</label>
            <input type="date" class="form-control" id="nascimento" name="nascimento" required valu="01-01-1990">
            </div>

            <div class="form-group">
            <label for="CPF" class="form-label">CPF:</label>
            <input type="text" class="form-control" id="CPF" name="CPF" required value="000.000.000-00">
            </div>

            <div class="form-group">
                <button type="button" class="btn btn-primary" onclick="mensagem()">Salvar</button>
            </div>

        </form>
    </main>

    <script type="text/javascript" class="script">
        function mensagem(){
            const msg = document.querySelector('#mensagem');
            msg.style.display = 'block';
            msg.textContent = "Perfil salvo com sucesso!"
        }

        function validaCPF(){
            const cpf = document.querySelector('#CPF').value;
            // Implement CPF validation logic here
            console.log(cpf);
            if(cpf.length !== 11){
                alert("CPF inválido!");
                   const msg = document.querySelector('#mensagem');
                msg.style.display = 'block';
                msg.textContent = "CPF inválido!"
        }
            }
    </script>
</body>
</html>
