<!DOCTYPE html>
<html lang="pt-BR"
<head>
    <meta charset="UTF-8"
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="cabecalho">
    <div class="container navbar">
     <h1 class="logo">Rota Livre</h1>
        <nav>
            <ul class="menu-navegação"
            <li><a href="#passagens">Passagens</a></li>
            <li><a href="#hoteis">Hoteis</a></li>
            <li><a href="#pacotes">Pacotes</a></li>
            <li><a href="#contato">Contato</a></li>
         </ul>
         </nav>
     </div>
</header>

<section class="hero">
    <div class="container"
    <h2>Encontre o destino perfeito para a sua viagem!</h2>
    <p>Passagens aéreas e hospedagens com os melhores preços do mercado.</p>
    <form class="form-busca">
        <div class="campo-busca"
        <label for="origem">Origem</label>
        <input type="text" id="origem" placeholder="De onde você vai sair?">
    </div>
    <div class="campo-busca"
        <label for="destino">Destino</label>
        <input type="text" id="destino" placeholder="Para onde quer ir?">
</div>
<div class="campo-busca"
        <label for="data">Data</label>
        <input type="date" id="data">
</div>
<button type="submit" class="button-buscar">Pesquisar</button>
    </form>
</section>

</body>
