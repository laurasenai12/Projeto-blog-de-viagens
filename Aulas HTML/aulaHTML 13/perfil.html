<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="cabecalho">
    <a href="index.html" class="logo">
        <img src="Logo 2.png" alt="Logo Rota Livre" width="50" height="50">
    </a>
</header>
    <main class="container">
        <form class="formulario" id="formPerfil" onsubmit="return false;">
            <div class="titulo-formulario">
                <div>
                    <h2>Meu perfil</h2>
                    <p>Atualize suas informações pessoais e preferências.</p>
                </div>
            </div>

            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;"></div>

            <div class="foto-perfil">
                <img src="images.jpg" alt="Avatar ilustrativo do perfil" width="120" height="120"
                     onmouseover="console.log('Mouse sobre a imagem!')">
            </div>

            <div class="form-group">
                <div class="col-md-6 form-group mb-3">
                    <label for="nome" class="form-label">Nome completo:</label>
                    <input type="text" class="form-control" id="nome" name="nome"
                           placeholder="Digite seu nome completo" required>
                </div>

                
            <div class="col-md-6 form-group mb-3">
                <label for="nascimento" class="form-label">Data de nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento" max="2026-10-31" required>
            </div>

                <div class="form-group">
                    <label for="cpf" class="form-label">CPF:</label>
                    <input type="text" class="form-control" id="cpf" name="cpf"
                           placeholder="000.000.000-00" maxlength="14" required>
                    <small class="texto-ajuda">Digite o seu CPF.</small>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="nome@exemplo.com">
                </div>
            </div>

            <div class="form-group">
                <label for="destino" class="form-label">Tipo de viagem favorita:</label>
                <select class="form-select" id="destino" name="destino" required>
                    <option value="">Selecione uma opção</option>
                    <option value="Praia">Praia</option>
                    <option value="Natureza">Natureza</option>
                    <option value="Cidade">Cidade</option>
                </select>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="novidades" name="novidades">
                <label class="form-check-label" for="novidades">
                    Quero receber novidades e ofertas do Rota Livre.
                </label>
            </div>

            <div class="botoes">
                <button type="reset" class="btn btn-outline-primary" onclick="limparMensagem()">Limpar</button>
                <button type="button" class="btn btn-primary" onclick="salvarPerfil()">Salvar perfil</button>
            </div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
